name: Update Wix feature requests
on:
  schedule:
    - cron: "15 4 * * *"
    - cron: "40 15 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Get the latest updater
        run: |
          if curl -fsSL "https://headless-qiazfzvqaqv-salomoni0-1409.wix-site-host.com/updater/update.mjs" -o /tmp/update.mjs && node --check /tmp/update.mjs; then
            cp /tmp/update.mjs updater/update.mjs
            echo "Using the latest updater from the tracker site."
          else
            echo "Could not download the latest updater; using the copy in this repository."
          fi
      - run: node updater/update.mjs
        env:
          FULL_SCAN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: Save changes
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push
