name: Update Wix feature requests
on:
  schedule:
    - cron: "15 4 * * *"   # every day at 04:15 UTC
  workflow_dispatch: {}     # lets you run it any time from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node updater/update.mjs
      - name: Save changes
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push
